[package]
name = "botlib"
version.workspace = true
edition = "2021"
description = "Shared library for General Bots - common types, utilities, and HTTP client"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"
keywords = ["bot", "chatbot", "ai", "conversational", "library"]
categories = ["api-bindings", "web-programming"]

[features]
default = ["database", "i18n"]
full = ["database", "http-client", "validation", "resilience", "i18n", "sqlite"]
database = ["i18n", "dep:diesel"]
http-client = ["dep:reqwest"]
validation = []
resilience = []
i18n = ["dep:rust-embed"]
sqlite = ["dep:rusqlite"]

[dependencies]
# Core
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
toml = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
dirs = { workspace = true }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "uuid", "serde_json"], optional = true }

# Optional: HTTP Client
reqwest = { workspace = true, features = ["json", "rustls-tls"], optional = true }

# Optional: i18n
rust-embed = { workspace = true, optional = true, features = ["debug-embed"] }

# Optional: SQLite driver for non-Linux platforms
rusqlite = { version = "0.32", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
rusqlite = { version = "0.32" }

[lints]
workspace = true
