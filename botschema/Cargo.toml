[package]
name = "botschema"
version.workspace = true
edition = "2021"
description = "Diesel database schema definitions - single source of truth for all table macros"
license = "MIT"

[features]
default = []
tasks = []
mail = []
people = []
tickets = []
billing = []
attendant = []
calendar = []
goals = []
canvas = []
workspaces = []
social = []
analytics = ["dashboards"]
compliance = []
meet = []
research = []
learn = []
project = []
dashboards = []
video = []
security = []
agents = []
browse = []
consent = []
marketplace = []
integrations = []
memory = []
autotask = []
channels = []
cloud = []
full = [
    "tasks", "mail", "people", "tickets", "billing", "attendant", "calendar",
    "goals", "canvas", "workspaces", "social", "analytics", "compliance",
    "meet", "research", "learn", "project", "dashboards", "video", "security", "agents", "browse", "consent", "marketplace", "integrations", "memory", "channels", "autotask",
]

[dependencies]
diesel = { workspace = true, features = ["postgres", "uuid", "chrono", "serde_json", "r2d2", "numeric", "64-column-tables"] }
chrono = { workspace = true, features = ["serde", "clock"] }
uuid = { workspace = true, features = ["serde", "v4"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
