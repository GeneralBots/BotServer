[package]
name = "botautotask"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[features]
default = []
llm = []
drive = ["rust-s3"]

[dependencies]
async-trait = { workspace = true }
botlib = { workspace = true, features = ["database"] }
botcore = { workspace = true }
botbasic_compiler = { workspace = true }
botbasic_core = { workspace = true }

diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid"] }
r2d2 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
log = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "process"] }
axum = { workspace = true }
rhai = { workspace = true }
rust-s3 = { workspace = true, optional = true }
futures = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
