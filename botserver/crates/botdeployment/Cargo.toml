[package]
name = "botdeployment"
version.workspace = true
edition = "2021"
description = "General Bots deployment infrastructure for VibeCode platform"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botlib = { workspace = true, features = ["database"] }
botcoresecrets = { workspace = true }
axum = { workspace = true }
git2 = "0.20"
log = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "fs", "process"] }
diesel = { workspace = true, features = ["postgres", "uuid", "chrono", "r2d2"] }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
toml = { workspace = true }
botsecurity-auth = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
