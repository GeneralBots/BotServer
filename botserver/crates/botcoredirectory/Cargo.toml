[package]
name = "botcoredirectory"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[features]
default = []
drive = []
mail = []

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
botcoresecrets = { workspace = true }
botschema = { workspace = true, features = ["mail"] }
chrono = { workspace = true, features = ["clock", "std"] }
diesel = { workspace = true, features = ["postgres", "uuid", "chrono", "serde_json", "r2d2", "numeric", "32-column-tables", "extras"] }
log = { workspace = true }
r2d2 = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
once_cell = { workspace = true }
rand = { workspace = true }
dirs = { workspace = true }
botcore = { workspace = true }
botlib = { workspace = true, features = ["database"] }
botsecurity = { workspace = true }
