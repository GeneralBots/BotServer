[package]
name = "botplayer"
version.workspace = true
edition = "2021"
description = "General Bots media player"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
botcore = { workspace = true }
botbasic_core = { workspace = true }
botsecurity-core = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "fs"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[lints]
workspace = true
