[package]
name = "botvibe"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[features]
default = []

[dependencies]
botcore = { workspace = true }
botcoresecrets = { workspace = true }
botsecurity-core = { workspace = true }
tar = { workspace = true }
botlib = { workspace = true }
botautotask = { workspace = true }
botcontacts = { workspace = true }
botdeployment = { workspace = true }
botsecurity-auth = { workspace = true }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid"] }
r2d2 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
log = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
axum = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json"], default-features = true }
base64 = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["connect"] }
