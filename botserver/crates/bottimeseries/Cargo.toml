[package]
name = "bottimeseries"
version.workspace = true
edition = "2021"
description = "General Bots time-series metrics service (InfluxDB-compatible)"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botlib = { workspace = true, features = ["http-client"] }
chrono = { workspace = true, features = ["serde", "clock"] }
log = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }

[lints]
workspace = true
