[package]
name = "botproject"
version.workspace = true
edition = "2021"
description = "General Bots project management"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botlib = { workspace = true, features = ["database"] }
axum = { workspace = true }
botsecurity-auth = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid"] }
log = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[lints]
workspace = true
