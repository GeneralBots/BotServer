[package]
name = "botbrowserpolicy"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"
description = "Hardened agentic browsing control plane: domain policy, budgets, browsing memory and task orchestration API (#1175 backend)."

[dependencies]
botlib = { workspace = true, features = ["database"] }
async-stream = { workspace = true }
axum = { workspace = true }
botsecurity-auth = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[lints]
workspace = true
