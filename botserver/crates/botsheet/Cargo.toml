[package]
name = "botsheet"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botlib = { workspace = true }
botsecurity-core = { workspace = true }
botsheet-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4"] }
axum = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
futures-util = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
async-trait = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
sha2 = { workspace = true }
umya-spreadsheet = { workspace = true, optional = true }
rust_xlsxwriter = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
quick-xml = { workspace = true }

[features]
default = ["xlsx"]
xlsx = ["dep:umya-spreadsheet", "dep:rust_xlsxwriter", "dep:calamine", "dep:zip"]

[lints]
workspace = true
