[package]
name = "botattendant"
version.workspace = true
edition = "2021"
description = "General Bots contact center attendant queue, session, and agent management"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botlib = { workspace = true, features = ["database"] }
botsecurity-core = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
r2d2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "fs"] }
uuid = { workspace = true, features = ["serde", "v4"] }
log = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
