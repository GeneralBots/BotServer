[package]
name = "botdesktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Desktop session proxy — WebSocket-to-TCP relay for remote desktop connections"

[dependencies]
botlib = { workspace = true, features = ["database"] }
axum = { workspace = true, features = ["ws", "macros"] }
botsecurity-core = { workspace = true }
tokio = { workspace = true, features = ["full"], default-features = true }
serde = { workspace = true, features = ["derive"], default-features = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"], default-features = true }
chrono = { workspace = true, features = ["serde"], default-features = true }
diesel = { workspace = true, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
reqwest = { workspace = true, features = ["json"], default-features = true }
tower-http = { workspace = true, features = ["cors", "trace"], default-features = true }
futures-util = { workspace = true, default-features = true }
tracing = { workspace = true }
thiserror = { workspace = true }
botcoresecrets = { workspace = true }
botsecurity-auth = { workspace = true }
