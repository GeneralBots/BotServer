[package]
name = "botgl"
version.workspace = true
edition = "2021"
license = "MIT"

[dependencies]
serde = { workspace = true, features = ["derive"], default-features = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"], default-features = true }
uuid = { workspace = true, features = ["v4", "serde"], default-features = true }
diesel = { workspace = true, features = ["postgres", "r2d2", "uuid", "serde_json", "chrono", "numeric"] }
axum = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["full"], default-features = true }
log = { workspace = true }
rust_decimal = { workspace = true, features = ["serde-with-str", "db-diesel2-postgres"] }
botsecurity-core = { workspace = true }
