[package]
name = "botdrive"
version.workspace = true
edition = "2021"
license = "MIT"

[features]
default = []
vectordb = []
sheet = ["dep:calamine"]
drive = ["dep:pdf-extract"]
research = []
llm = []

[dependencies]
botcore = { workspace = true }
botlib = { workspace = true }
botbasic_core = { workspace = true }
botschema = { workspace = true }
botqdrant = { workspace = true }
axum = { workspace = true, features = ["ws", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid"] }
chrono = { workspace = true, features = ["clock", "std"] }
uuid = { workspace = true, features = ["v4", "serde"] }
log = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
rust-s3 = { workspace = true }
regex = { workspace = true }
zip = { workspace = true }
calamine = { workspace = true, optional = true }
pdf-extract = { workspace = true, optional = true }
tracing = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
botsecurity-auth = { workspace = true }
botsecurity-crypto = { workspace = true }
http = { workspace = true }
url = { workspace = true }
time = { workspace = true, features = ["formatting", "macros", "parsing"] }

[lints]
workspace = true
