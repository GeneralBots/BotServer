[package]
name = "botsecurity-protection"
version.workspace = true
edition = "2021"
description = "General Bots protection: firewall, IDS, hardening automation"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botsecurity-core = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws", "macros"] }
chrono = { workspace = true, features = ["serde", "clock"] }
log = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[lints]
workspace = true
