[package]
name = "botpeople"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botlib = { workspace = true, features = ["database"] }
botschema = { workspace = true, features = ["people"] }
botsecurity-core = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart", "macros"] }
bigdecimal = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid", "numeric"] }
r2d2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
uuid = { workspace = true, features = ["v4", "serde"] }

[lints]
workspace = true
