[package]
name = "botanalytics"
version.workspace = true
edition = "2021"
description = "General Bots analytics, insights, OKR goals tracking, and reporting"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[features]
default = []
goals = []
llm = []

[dependencies]
botlib = { workspace = true, features = ["database"] }
axum = { workspace = true }
base64 = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json", "numeric"] }
log = { workspace = true }
r2d2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[lints]
workspace = true
