[package]
name = "botcompliance"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botlib = { workspace = true, features = ["database"] }
botschema = { workspace = true, features = ["compliance"] }
anyhow = { workspace = true }
bigdecimal = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
csv = { workspace = true }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid", "numeric"] }
log = { workspace = true }
r2d2 = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
walkdir = { workspace = true }
