[package]
name = "botcalendar"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botlib = { workspace = true, features = ["database"] }
axum = { workspace = true, features = ["ws", "multipart", "macros"] }
botschema = { workspace = true, features = ["calendar"] }
botsecurity-core = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
icalendar = { workspace = true }
log = { workspace = true }
r2d2 = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "io-util"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[lints]
workspace = true
