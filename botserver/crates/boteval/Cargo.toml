[package]
name = "boteval"
version.workspace = true
edition = "2021"
description = "LLM response evaluation framework (datasets, contracts, runner, CI gate)"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
serde = { workspace = true, features = ["derive"], default-features = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"], default-features = true }
log = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"], default-features = true }
reqwest = { workspace = true, features = ["json"], optional = true, default-features = true }
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"], default-features = true }
toml = { workspace = true }
botvibe = { workspace = true, optional = true }
diesel = { workspace = true, features = ["postgres", "r2d2"], optional = true }

[features]
default = []
http = ["dep:reqwest"]
vibe = ["dep:botvibe", "dep:diesel"]

[[bin]]
name = "boteval-run"
path = "src/bin/boteval_run.rs"
required-features = ["http", "vibe"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"], default-features = true }
