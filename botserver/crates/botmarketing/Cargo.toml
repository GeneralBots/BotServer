[package]
name = "botmarketing"
version.workspace = true
edition = "2021"
description = "General Bots marketing campaigns, email, WhatsApp, IP routing, warmup, and advisor"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botsecurity-core = { workspace = true }
botmultimodal = { workspace = true }
botinstagram = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json", "numeric"] }
log = { workspace = true }
r2d2 = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[lints]
workspace = true
