[package]
name = "botdesigner"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
diesel = { workspace = true, features = ["postgres", "uuid", "chrono", "serde_json", "r2d2", "numeric", "32-column-tables"] }
r2d2 = { workspace = true }
botcore = { workspace = true }
axum = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["clock", "std", "serde"] }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
log = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
