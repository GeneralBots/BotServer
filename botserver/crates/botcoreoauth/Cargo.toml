[package]
name = "botcoreoauth"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botlib = { workspace = true, features = ["database"] }
botschema = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
botcoresecrets = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
diesel = { workspace = true, features = ["postgres", "uuid", "chrono", "serde_json", "r2d2", "numeric", "32-column-tables"] }
log = { workspace = true }
rand = { workspace = true }
r2d2 = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }
