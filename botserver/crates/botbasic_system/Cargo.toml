[package]
name = "botbasic_system"
version.workspace = true
edition = "2021"
description = "BASIC system keywords - bot management, file ops, scheduling, security, app server, face API"
license = "MIT"

[features]
default = []
chat = []
automation = []
tasks = []
drive = []
security = []
llm = []
vibe = ["dep:botdeployment"]

[dependencies]
botcoresecrets = { workspace = true }
botbasic_types = { workspace = true }
rhai = { workspace = true, features = ["sync"] }

botlib = { workspace = true }
botschema = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
cron = { workspace = true }
diesel = { workspace = true, features = ["postgres", "uuid", "chrono", "serde_json", "r2d2", "numeric", "32-column-tables"] }
log = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json", "multipart"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

botcore = { workspace = true }
botcorepkg = { workspace = true }
botsecurity = { workspace = true }
botmodelsbridge = { workspace = true }
botbasic_core = { workspace = true }
botbasic_data = { workspace = true }
axum = { workspace = true, features = ["ws", "macros"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
urlencoding = { workspace = true }
zip = { workspace = true }
botdeployment = { workspace = true, optional = true }

[lints]
workspace = true
