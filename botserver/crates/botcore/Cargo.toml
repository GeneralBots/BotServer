[package]
name = "botcore"
version.workspace = true
edition = "2021"
license = "MIT"

[dependencies]
botbasic_types = { workspace = true }
botschema = { workspace = true }
botlib = { workspace = true, features = ["database"] }
botsecurity-crypto = { workspace = true }
# botsecurity removed to break circular dep — use botlib::security:: instead
botcorepkg = { workspace = true }
botcoresecrets = { workspace = true }
botsecurity-core = { workspace = true }
base64 = { workspace = true }
dotenvy = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
zip = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
quick-xml = { workspace = true }
url = { workspace = true }
# botllm removed to break circular dep (botllm depends on botcore)
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
calamine = { workspace = true }
ole = { version = "0.1", optional = true }
pdf-extract = { workspace = true, optional = true }
chrono = { workspace = true }
cron = { workspace = true }
dirs = { workspace = true }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid"] }
diesel_migrations = { workspace = true }
governor = { workspace = true }
indicatif = { workspace = true, optional = true }
jsonwebtoken = { workspace = true }
lettre = { workspace = true, optional = true }
log = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
redis = { workspace = true, optional = true }
regex = { workspace = true }
reqwest = { workspace = true }
rhai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smartstring = { workspace = true }
sysinfo = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "process", "time"] }
tower = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "registry"] }
uuid = { workspace = true }
urlencoding = { workspace = true }

[features]
default = ["cache", "mail", "tasks", "people", "tickets", "billing", "attendant",
"calendar", "goals", "canvas", "workspaces", "social", "analytics",
"compliance", "meet", "research", "rbac", "learn", "project", "dashboards", "monitoring", "directory"]
