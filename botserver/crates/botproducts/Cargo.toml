[package]
name = "botproducts"
version.workspace = true
edition = "2021"
description = "General Bots products, services, inventory, and pricing management"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botlib = { workspace = true, features = ["database"] }
botschema = { workspace = true, features = ["billing"] }
botsecurity-core = { workspace = true }
axum = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
bottax = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
log = { workspace = true }
diesel = { workspace = true, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json", "numeric", "64-column-tables"] }
r2d2 = { workspace = true }
rust_decimal = { workspace = true, features = ["serde-with-str", "db-diesel2-postgres"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "fs"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[lints]
workspace = true
