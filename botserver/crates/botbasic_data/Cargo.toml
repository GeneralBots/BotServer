[package]
name = "botbasic_data"
version.workspace = true
edition = "2021"
description = "BASIC data keywords - database operations, tables, memory, KB, CRM, products"
license = "MIT"

[features]
default = []
vectordb = []
people = []
billing = []
llm = []
drive = ["dep:pdf-extract"]
sheet = ["dep:calamine", "dep:rust_xlsxwriter"]
mail = ["dep:imap", "dep:mailparse", "botqdrant/mail"]

[dependencies]
botlib = { workspace = true, features = ["database", "http-client"] }
botbasic_types = { workspace = true }
botbasic_core = { workspace = true }
botcoresecrets = { workspace = true }
rhai = { workspace = true, features = ["sync"] }
diesel = { workspace = true, features = ["postgres", "uuid", "chrono", "serde_json", "r2d2", "numeric", "32-column-tables"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
uuid = { workspace = true, features = ["v4"] }
regex = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }

tokio = { workspace = true, features = ["sync", "rt", "macros", "fs"] }
url = { workspace = true }
botcore = { workspace = true }
botsecurity = { workspace = true }
axum = { workspace = true, features = ["ws", "macros"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
botqdrant = { workspace = true }
imap = { workspace = true, optional = true }
mailparse = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
rust_xlsxwriter = { workspace = true, optional = true }
pdf-extract = { workspace = true, optional = true }

[lints]
workspace = true
