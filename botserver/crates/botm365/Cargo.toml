[package]
name = "botm365"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Microsoft 365 integration: SharePoint connector, OAuth2 with Zitadel, Graph client."

[dependencies]
botcore = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
axum = { workspace = true, features = ["macros"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "serde_json", "chrono", "uuid"] }
botdrive = { workspace = true }

[lints]
workspace = true
