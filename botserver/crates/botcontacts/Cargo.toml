[package]
name = "botcontacts"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[features]
calendar = []
external_sync = []
tasks = []

[dependencies]
botlib = { workspace = true, features = ["database"] }
botsecurity-core = { workspace = true }
csv = { workspace = true }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid"] }
diesel_migrations = { workspace = true }
axum = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["sync"] }
log = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde_urlencoded = "0.7"
