[package]
name = "botmultimodal"
version.workspace = true
edition = "2021"
description = "General Bots multimodal AI client (image, video, audio, speech)"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
 botcore = { workspace = true }
 botlib = { workspace = true, features = ["http-client"] }
log = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json", "multipart"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[lints]
workspace = true
