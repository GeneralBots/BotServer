[package]
name = "bottax"
version.workspace = true
edition = "2021"
license = "MIT"

[dependencies]
axum = { workspace = true }
botbrazil = { workspace = true }
botcore = { workspace = true }
botlib = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "uuid", "chrono", "serde_json", "r2d2", "numeric", "32-column-tables"] }
log = { workspace = true }
rust_decimal = { workspace = true, features = ["serde-with-str", "db-diesel2-postgres"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true, features = ["v4", "serde"] }
