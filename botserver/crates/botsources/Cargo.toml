[package]
name = "botsources"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[features]
drive = ["pdf-extract"]

[dependencies]
botlib = { workspace = true, features = ["database"] }
botschema = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
botcoresecrets = { workspace = true }
botsecurity-core = { workspace = true }
chrono = { workspace = true, features = ["clock", "std", "serde"] }
diesel = { workspace = true, features = ["extras", "postgres", "uuid", "chrono", "serde_json", "r2d2", "numeric", "32-column-tables"] }
log = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json", "blocking"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
zip = { workspace = true }
pdf-extract = { workspace = true, optional = true }

[lints]
workspace = true
