[package]
name = "botsocial"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
axum = { workspace = true, features = ["ws", "multipart", "macros"] }
chrono = { workspace = true, features = ["serde"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "chrono", "serde_json", "uuid"] }
r2d2 = { workspace = true }
serde = { workspace = true, features = ["derive"], default-features = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = false }
uuid = { workspace = true, features = ["v4", "serde"] }
