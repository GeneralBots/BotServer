[package]
name = "botsampledata"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"
description = "Idempotent demo data seeding for a production-ready General Bots instance."

[dependencies]
argon2 = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json", "numeric", "32-column-tables"] }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "io-util"] }
uuid = { workspace = true, features = ["serde", "v4"] }
botcore = { workspace = true }
botbasic_core = { workspace = true }
botlib = { workspace = true }

[lints]
workspace = true
