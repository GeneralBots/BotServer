[package]
name = "botsecurity"
version.workspace = true
edition = "2021"
description = "General Bots security infrastructure (facade crate)"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[features]
default = []
cache = ["botsecurity-auth/cache"]
directory = ["botsecurity-auth/directory"]

[dependencies]
botschema = { workspace = true, features = ["security"] }
botsecurity-core = { workspace = true }
botsecurity-crypto = { workspace = true }
botsecurity-auth = { workspace = true }
botsecurity-protection = { workspace = true }
anyhow = { workspace = true }

diesel = { workspace = true, features = ["postgres", "r2d2"] }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
base64 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "blocking"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "rt-multi-thread"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[lints]
workspace = true
