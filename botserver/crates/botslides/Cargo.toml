[package]
name = "botslides"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botlib = { workspace = true }
botsecurity-auth = { workspace = true }
axum = { workspace = true }
botsecurity-core = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
diesel = { workspace = true, features = ["r2d2", "postgres"] }
ooxmlsdk = { workspace = true, features = ["parts"] }
zip = { workspace = true }
