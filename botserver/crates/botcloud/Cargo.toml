[package]
name = "botcloud"
version = "0.1.0"
edition = "2021"
description = "General Bots SaaS - public checkout & subscriber dashboard using botbilling"
license = "MIT"
authors = ["General Bots"]
repository = "https://github.com/generalbots/generalbots"

[dependencies]
botschema = { workspace = true, features = ["billing", "cloud"] }
botlib = { workspace = true, features = ["database"] }
argon2 = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
diesel = { workspace = true, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json", "numeric"] }
hmac = { workspace = true }
sha2 = { workspace = true }
r2d2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "fs"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5"] }
bigdecimal = { workspace = true, features = ["serde"] }
url = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rand = { workspace = true }
lettre = { workspace = true, features = ["tokio1-rustls-tls", "tokio1"] }
botbilling = { workspace = true }
botdomains = { workspace = true }
botproviders = { workspace = true }
botsecurity = { workspace = true }
botsecurity-auth = { workspace = true }
botsecurity-crypto = { workspace = true }
botproducts = { workspace = true, optional = true }
botcoredirectory = { workspace = true }
botcoresecrets = { workspace = true }

[features]
saas = ["dep:botproducts"]

[lints]
workspace = true
